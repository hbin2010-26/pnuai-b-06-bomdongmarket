spring:
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3307/farmbroker?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD}"
  servlet:
    multipart:
      # 한 장 5MB × 최대 10장 + 멀티파트 오버헤드
      max-file-size: "${FILE_MAX_FILE_SIZE:5MB}"
      max-request-size: "${FILE_MAX_REQUEST_SIZE:55MB}"
  jpa:
    hibernate:
      ddl-auto: "${JPA_DDL_AUTO:update}"
    open-in-view: "${JPA_OPEN_IN_VIEW:false}"
    show-sql: "${JPA_SHOW_SQL:false}"
    properties:
      hibernate:
        format_sql: "${JPA_FORMAT_SQL:false}"
  mail:
    # Gmail 앱 비밀번호(계정 2단계 인증 필수)를 쓴다.
    # MAIL_USERNAME이 비어 있으면 실제 발송 대신 인증번호를 서버 콘솔에 찍는다(로컬 개발용).
    host: "${MAIL_HOST:smtp.gmail.com}"
    port: ${MAIL_PORT:587}
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # 타임아웃이 없으면 Gmail 연결이 늘어질 때 요청 스레드가 그대로 묶인다.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: "${PORT:8080}"
  servlet:
    context-path: "${SERVER_CONTEXT_PATH:/api}"

cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}"

file:
  # 업로드 이미지 저장 경로. Docker에서는 named volume을 이 경로에 마운트한다.
  upload-dir: "${FILE_UPLOAD_DIR:./uploads}"
  # 채팅 이미지도 환경별 저장 경로를 명시해 Docker에서는 같은 업로드 볼륨을 사용한다.
  chat-upload-dir: "${FILE_CHAT_UPLOAD_DIR:./uploads/chat}"

jwt:
  secret: "${JWT_SECRET}"
  expiration: "${JWT_EXPIRATION:86400000}"
  # STOMP CONNECT에만 쓰는 단기 티켓. 연결 후 만료돼도 열린 WebSocket은 유지된다.
  websocket-ticket-expiration: "${JWT_WEBSOCKET_TICKET_EXPIRATION:60000}"
  cookie:
    # Access Token을 담는 httpOnly 쿠키 속성. dev(http)는 secure=false, prod(https)는 secure=true로 토글.
    name: "${JWT_COOKIE_NAME:accessToken}"
    secure: "${JWT_COOKIE_SECURE:false}"
    same-site: "${JWT_COOKIE_SAMESITE:Lax}"

gemini:
  api-key: "${GEMINI_API_KEY:}"
  model: "${GEMINI_MODEL:gemini-2.5-flash}"
  base-url: "${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}"

# KAMIS(공공데이터포털 일별 도·소매 가격정보) 시세 수집.
# 대표값을 어떻게 고를지는 협의 중이라(#66) 코드에 박지 않고 여기서 조정한다.
kamis:
  service-key: "${KAMIS_SERVICE_KEY:}"
  base-url: "${KAMIS_BASE_URL:https://apis.data.go.kr/B552845/perDay/price}"
  # 스케줄·조회일·수집시각이 서버 기본 시간대에 흔들리지 않도록 명시한다.
  timezone: "${KAMIS_TIMEZONE:Asia/Seoul}"
  connect-timeout-ms: ${KAMIS_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${KAMIS_READ_TIMEOUT_MS:5000}
  # 01 소매 / 02 중도매. 소매가는 유통마진이 붙어 재배자가 넘기는 값과 다르다.
  sale-type: "${KAMIS_SALE_TYPE:02}"
  # 시군구명. 비우면 전국 — 지역을 좁히면 하루 1건만 잡히는 작물이 있다.
  region: "${KAMIS_REGION:}"
  grade: "${KAMIS_GRADE:상품}"
  freshness-days: ${KAMIS_FRESHNESS_DAYS:7}
  lookback-days: ${KAMIS_LOOKBACK_DAYS:14}
  # 키가 없으면 어차피 동작하지 않으므로 기본은 켜 두고 키 유무로 판단한다.
  enabled: ${KAMIS_ENABLED:true}
  # 수집 주기. 기본은 매일 04:00.
  cron: "${KAMIS_CRON:0 0 4 * * *}"

# 회원가입 전 이메일 인증. 발표 중에 값을 조정해야 할 수 있어 코드에 박지 않는다.
auth:
  email-verification:
    ttl-seconds: ${EMAIL_VERIFICATION_TTL_SECONDS:300}
    resend-cooldown-seconds: ${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
    max-attempts: ${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}
    # 인증을 마치고 이 시간 안에 가입해야 한다.
    verified-window-minutes: ${EMAIL_VERIFICATION_VERIFIED_WINDOW_MINUTES:30}
